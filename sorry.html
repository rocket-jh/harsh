<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kya Galti Hai Meri?</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #e8d5f5 0%, #d4b8f0 30%, #c9a8e8 60%, #b8a0d8 100%);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .bg-float {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-item {
      position: absolute;
      font-size: 1.4rem;
      opacity: 0;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0.6;
      }

      100% {
        transform: translateY(-20vh) rotate(360deg);
        opacity: 0;
      }
    }

    #main-card {
      position: relative;
      z-index: 10;
    }

    .heading-font {
      font-family: 'Pacifico', cursive;
    }

    .glow-purple {
      text-shadow:
        0 0 10px rgba(180, 100, 255, 0.9),
        0 0 30px rgba(180, 100, 255, 0.6),
        0 0 60px rgba(180, 100, 255, 0.3);
    }

    .ribbon {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      color: white;
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 4px 18px;
      border-radius: 20px;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.5);
    }

    @keyframes heartbreak {

      0%,
      100% {
        transform: scale(1);
      }

      20% {
        transform: scale(1.12) rotate(-3deg);
      }

      40% {
        transform: scale(0.95) rotate(3deg);
      }

      60% {
        transform: scale(1.08) rotate(-2deg);
      }

      80% {
        transform: scale(0.98) rotate(2deg);
      }
    }

    .heartbreak {
      animation: heartbreak 1.8s ease-in-out infinite;
    }

    #cat-scene {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(100, 50, 150, 0.12);
      backdrop-filter: blur(4px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cat-wrap {
      position: relative;
      display: inline-block;
    }

    .cat-body {
      width: 210px;
      height: 210px;
      filter: drop-shadow(0 20px 40px rgba(120, 60, 200, 0.5));
    }

    .tear-drop {
      position: absolute;
      font-size: 1.8rem;
      pointer-events: none;
      opacity: 0;
    }

    #btn-no {
      position: fixed;
      background: linear-gradient(135deg, #a0a0a0, #6b6b6b);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.25rem;
      padding: 16px 40px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      z-index: 999;
      opacity: 0;
    }

    #log-panel {
      display: none;
      position: fixed;
      bottom: 0;
      right: 0;
      width: 340px;
      max-height: 300px;
      background: rgba(0, 0, 0, 0.88);
      color: #00ff88;
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      padding: 12px;
      overflow-y: auto;
      z-index: 9999;
      border-top-left-radius: 12px;
      border: 1px solid #00ff88;
    }

    #log-panel h4 {
      color: #a855f7;
      margin-bottom: 8px;
      font-size: 0.85rem;
      border-bottom: 1px solid #00ff88;
      padding-bottom: 4px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #a855f7;
      border-radius: 3px;
    }

    .confetti-piece {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
    }

    #sob-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
    }

    #sob-emoji {
      font-size: 7rem;
      line-height: 1;
    }

    #sob-text {
      font-size: 1.3rem;
      font-weight: 900;
      color: #7c3aed;
      margin-top: 10px;
      font-family: 'Nunito', sans-serif;
    }
  </style>
</head>

<body>

  <div class="bg-float" id="bgFloat"></div>

  <div id="main-card" class="min-h-screen flex items-center justify-center p-6">
    <div
      class="relative bg-white/60 backdrop-blur-xl rounded-3xl shadow-2xl p-10 md:p-16 max-w-md w-full text-center border border-white/80">

      <div class="ribbon">💔 BATAO MUJHE 💔</div>

      <div class="heartbreak text-8xl mb-6 leading-none select-none">💔</div>

      <h1 class="heading-font text-4xl md:text-5xl text-purple-600 glow-purple mb-3 leading-tight">
        Kya Galti<br />Hai Meri?
      </h1>

      <p class="text-purple-400 text-sm mb-10 font-semibold tracking-wider">
        Sach batao... 🥺
      </p>

      <div class="flex justify-center">
        <button id="btn-yes" onclick="handleYes()" style="
          background: linear-gradient(135deg, #a855f7, #7c3aed);
          box-shadow: 0 8px 32px rgba(124,58,237,0.5);
          color: white;
          font-family: 'Nunito', sans-serif;
          font-weight: 900;
          font-size: 1.3rem;
          padding: 16px 48px;
          border-radius: 16px;
          border: none;
          cursor: pointer;
          display: block;
          opacity: 1;
          transform: scale(1);
        ">
          😔 Haan, Hai
        </button>
      </div>

      <div id="dev-stats" style="display:none" class="mt-8 text-xs text-purple-300 font-semibold space-x-4">
        <span>💔 Yes: <span id="yes-count-display">0</span></span>
        <span>🏃 No: <span id="no-count-display">0</span></span>
      </div>
    </div>
  </div>

  <!-- Crying Cat Scene -->
  <div id="cat-scene">
    <button onclick="closeCatScene()"
      class="absolute top-6 right-6 text-white bg-purple-500/60 hover:bg-purple-500 rounded-full w-10 h-10 text-xl font-bold z-50 backdrop-blur-sm">
      ✕
    </button>

    <p id="love-msg" class="heading-font text-white text-3xl md:text-4xl mb-8 text-center px-6"
      style="text-shadow:0 0 20px rgba(200,150,255,0.9)"></p>

    <div class="cat-wrap" id="catWrap">
      <!-- Crying Cat SVG -->
      <svg class="cat-body" id="catSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Body -->
        <ellipse cx="100" cy="142" rx="52" ry="42" fill="#c4a8e8" />
        <!-- Head -->
        <circle cx="100" cy="88" r="42" fill="#d8bff5" />
        <!-- Left ear -->
        <polygon points="65,55 55,20 85,48" fill="#d8bff5" />
        <polygon points="67,52 60,28 82,48" fill="#a855f7" />
        <!-- Right ear -->
        <polygon points="135,55 145,20 115,48" fill="#d8bff5" />
        <polygon points="133,52 140,28 118,48" fill="#a855f7" />
        <!-- Blush left -->
        <ellipse cx="74" cy="100" rx="13" ry="9" fill="#a855f7" opacity="0.3" />
        <!-- Blush right -->
        <ellipse cx="126" cy="100" rx="13" ry="9" fill="#a855f7" opacity="0.3" />
        <!-- Sad closed eyes (curved down = sad) -->
        <!-- Left eye sad -->
        <path d="M76,82 Q85,76 94,82" stroke="#4c1d95" stroke-width="3" fill="none" stroke-linecap="round" />
        <!-- Right eye sad -->
        <path d="M106,82 Q115,76 124,82" stroke="#4c1d95" stroke-width="3" fill="none" stroke-linecap="round" />
        <!-- Tear left -->
        <ellipse cx="79" cy="91" rx="3" ry="5" fill="#60a5fa" opacity="0.9" />
        <path d="M79,96 Q78,102 80,107" stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <!-- Tear right -->
        <ellipse cx="121" cy="91" rx="3" ry="5" fill="#60a5fa" opacity="0.9" />
        <path d="M121,96 Q120,102 122,107" stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <!-- Nose -->
        <polygon points="100,99 96,106 104,106" fill="#a855f7" />
        <!-- Sad mouth -->
        <path d="M93,112 Q100,107 107,112" stroke="#a855f7" stroke-width="2" fill="none" stroke-linecap="round" />
        <!-- Whiskers left -->
        <line x1="55" y1="98" x2="80" y2="101" stroke="#a855f7" stroke-width="1.5" opacity="0.6" />
        <line x1="55" y1="106" x2="80" y2="105" stroke="#a855f7" stroke-width="1.5" opacity="0.6" />
        <!-- Whiskers right -->
        <line x1="145" y1="98" x2="120" y2="101" stroke="#a855f7" stroke-width="1.5" opacity="0.6" />
        <line x1="145" y1="106" x2="120" y2="105" stroke="#a855f7" stroke-width="1.5" opacity="0.6" />
        <!-- Tail (drooping sad) -->
        <path d="M148,158 Q175,160 165,175 Q155,185 145,175" stroke="#c4a8e8" stroke-width="12" fill="none"
          stroke-linecap="round" />
        <!-- Left paw (holding tissue) -->
        <ellipse cx="72" cy="158" rx="14" ry="10" fill="#d8bff5" />
        <circle cx="66" cy="162" r="3.5" fill="#c4a8e8" />
        <circle cx="72" cy="164" r="3.5" fill="#c4a8e8" />
        <circle cx="78" cy="162" r="3.5" fill="#c4a8e8" />
        <!-- Tissue -->
        <rect x="55" y="155" width="18" height="14" rx="4" fill="white" opacity="0.9" />
        <line x1="58" y1="160" x2="70" y2="160" stroke="#ddd" stroke-width="1" />
        <line x1="58" y1="163" x2="70" y2="163" stroke="#ddd" stroke-width="1" />
        <!-- Right paw -->
        <ellipse cx="128" cy="158" rx="14" ry="10" fill="#d8bff5" />
        <circle cx="122" cy="162" r="3.5" fill="#c4a8e8" />
        <circle cx="128" cy="164" r="3.5" fill="#c4a8e8" />
        <circle cx="134" cy="162" r="3.5" fill="#c4a8e8" />
      </svg>
    </div>

    <!-- Floating tears around cat -->
    <div id="tearsContainer" style="position:absolute;pointer-events:none;width:100%;height:100%;top:0;left:0"></div>

    <p class="text-white/80 text-base font-bold mt-8 tracking-wide" id="sorry-sub"></p>
  </div>

  <!-- Sob overlay for No button -->
  <div id="sob-overlay">
    <div id="sob-emoji">🙅‍♀️</div>
    <div id="sob-text">Nahi batana? 😤</div>
  </div>

  <div id="log-panel">
    <h4>🔐 Hidden Log — [Ctrl+Shift+L to close]</h4>
    <div id="log-entries"></div>
  </div>

  <script>
    const LOG_KEY = '__galti_log__';

    function getLog() {
      try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); }
      catch { return []; }
    }
    function saveLog(e) { localStorage.setItem(LOG_KEY, JSON.stringify(e)); }
    function appendLog(entry) { const e = getLog(); e.push(entry); saveLog(e); }

    let userIP = 'unknown';
    (async function () {
      try {
        const r = await fetch('https://api.ipify.org?format=json');
        const d = await r.json();
        userIP = d.ip || 'unknown';
      } catch { userIP = 'fetch-failed'; }
    })();

    let yesCount = parseInt(localStorage.getItem('__galti_yes__') || '0');
    let noCount = parseInt(localStorage.getItem('__galti_no__') || '0');

    function updateDisplays() {
      document.getElementById('yes-count-display').textContent = yesCount;
      document.getElementById('no-count-display').textContent = noCount;
    }
    updateDisplays();

    /* ── BACKGROUND FLOATING ITEMS ── */
    const bgItems = ['💔', '😢', '🥺', '💜', '😭', '✨', '💧', '🌧️'];
    const bgFloat = document.getElementById('bgFloat');
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('span');
      el.className = 'floating-item';
      el.textContent = bgItems[Math.floor(Math.random() * bgItems.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
      el.style.animationDuration = (7 + Math.random() * 9) + 's';
      el.style.animationDelay = (Math.random() * -15) + 's';
      bgFloat.appendChild(el);
    }

    /* ── NO BUTTON (body mein dynamically) ── */
    const btnNo = document.createElement('button');
    btnNo.id = 'btn-no';
    btnNo.textContent = 'Nahi hai';
    btnNo.onclick = handleNo;
    document.body.appendChild(btnNo);

    function placeNoBtn() {
      const yesRect = document.getElementById('btn-yes').getBoundingClientRect();
      const pad = 16, btnW = 160, btnH = 56;
      let x = yesRect.left + (yesRect.width / 2) - (btnW / 2);
      let y = yesRect.bottom + 24;
      x = Math.min(Math.max(pad, x), window.innerWidth - btnW - pad);
      y = Math.min(Math.max(pad, y), window.innerHeight - btnH - pad);
      btnNo.style.left = x + 'px';
      btnNo.style.top = y + 'px';
      btnNo.style.width = btnW + 'px';
      gsap.to(btnNo, {
        opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(2)', delay: 0.6,
        onStart: () => gsap.set(btnNo, { scale: 0 })
      });
    }
    window.addEventListener('load', placeNoBtn);

    function randomNoPosition() {
      const btnW = btnNo.offsetWidth || 160;
      const btnH = btnNo.offsetHeight || 56;
      const pad = 16;
      const maxX = Math.max(pad, window.innerWidth - btnW - pad);
      const maxY = Math.max(pad, window.innerHeight - btnH - pad);
      const x = pad + Math.random() * (maxX - pad);
      const y = pad + Math.random() * (maxY - pad);
      gsap.to(btnNo, { left: x, top: y, duration: 0.35, ease: 'power3.out' });
    }

    btnNo.addEventListener('mouseover', () => {
      randomNoPosition();
    });
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleNo();
    });

    function handleNo() {
      randomNoPosition();
      noCount++;
      localStorage.setItem('__galti_no__', noCount);
      updateDisplays();
      appendLog({ type: 'NO_ATTEMPT', ip: userIP, time: new Date().toISOString(), count: noCount });
    }

    /* ── SOB ANIMATION (for No) ── */
    const sobMessages = ['Nahi batana? 😤', 'Haan nahi hoga! 😤', 'Bhaag gaye! 😒', 'Pakad lo! 🏃'];
    let sobTimeout = null;

    function showSobAnimation() {
      const overlay = document.getElementById('sob-overlay');
      const emoji = document.getElementById('sob-emoji');
      const text = document.getElementById('sob-text');
      text.textContent = sobMessages[Math.floor(Math.random() * sobMessages.length)];
      if (sobTimeout) { clearTimeout(sobTimeout); gsap.killTweensOf(overlay); gsap.set(overlay, { opacity: 0 }); }
      const tl = gsap.timeline();
      tl.to(overlay, { opacity: 1, duration: 0.25, ease: 'power2.out' })
        .to(emoji, { y: -15, duration: 0.2, ease: 'power1.out' }, 0)
        .to(emoji, { y: 0, duration: 0.2, ease: 'bounce.out' }, 0.2)
        .to(emoji, { rotation: 10, duration: 0.07, ease: 'none', yoyo: true, repeat: 6 }, 0.4);
      sobTimeout = setTimeout(() => {
        gsap.to(overlay, { opacity: 0, duration: 0.5, ease: 'power2.in' });
      }, 2000);
    }

    /* ── YES HANDLER ── */
    const cryingMessages = [
      "Maine kya kiya... 💔",
      "Bata do mujhe... 😭",
      "Koi galti nahi hai teri... 💜",
      "Maafi chahiye mujhe... 🥺",
      "Sorry... dil dukha diya 💔"
    ];

    const sorrySubMessages = [
      "Sach batao, sunega...",
      "Tujhse naraaz nahi hun...",
      "Bas baat kar lo ek baar...",
      "Miss karta/karti hun tujhe...",
      "Please mat rona... 🥺"
    ];

    function handleYes() {
      yesCount++;
      localStorage.setItem('__galti_yes__', yesCount);
      updateDisplays();
      appendLog({ type: 'YES_CLICK', ip: userIP, time: new Date().toISOString(), count: yesCount });
      openCatScene();
    }

    function openCatScene() {
      const scene = document.getElementById('cat-scene');
      scene.style.display = 'flex';

      document.getElementById('love-msg').textContent =
        cryingMessages[Math.floor(Math.random() * cryingMessages.length)];
      document.getElementById('sorry-sub').textContent =
        sorrySubMessages[Math.floor(Math.random() * sorrySubMessages.length)];

      gsap.set('#catSvg', { scale: 0, rotation: 10, opacity: 0, transformOrigin: '50% 100%' });
      gsap.set('#love-msg', { y: -40, opacity: 0 });
      gsap.set('#sorry-sub', { y: 20, opacity: 0 });

      const tl = gsap.timeline();
      tl.to('#catSvg', { scale: 1, rotation: 0, opacity: 1, duration: 0.8, ease: 'back.out(1.6)' })
        .to('#catSvg', { y: -8, duration: 0.9, ease: 'power1.inOut', yoyo: true, repeat: -1 }, '+=0.2')
        .to('#love-msg', { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.5)
        .to('#sorry-sub', { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.75);

      spawnCatTears();
      spawnDrops();
    }

    function closeCatScene() {
      const scene = document.getElementById('cat-scene');
      gsap.to(scene, {
        opacity: 0, scale: 0.95, duration: 0.3,
        onComplete: () => { scene.style.display = 'none'; gsap.set(scene, { opacity: 1, scale: 1 }); }
      });
      document.getElementById('tearsContainer').innerHTML = '';
    }

    /* ── TEARS AROUND CAT ── */
    function spawnCatTears() {
      const wrap = document.getElementById('catWrap');
      const tearEmojis = ['💧', '💦', '😢', '💙'];
      for (let i = 0; i < 16; i++) {
        const t = document.createElement('span');
        t.className = 'tear-drop';
        t.textContent = tearEmojis[Math.floor(Math.random() * tearEmojis.length)];
        t.style.left = '50%';
        t.style.top = '50%';
        wrap.appendChild(t);
        const angle = (i / 16) * 360;
        const rad = angle * Math.PI / 180;
        const dist = 90 + Math.random() * 70;
        gsap.fromTo(t,
          { x: 0, y: 0, opacity: 1, scale: 0 },
          {
            x: Math.cos(rad) * dist, y: Math.sin(rad) * dist,
            opacity: 0, scale: 1 + Math.random(),
            duration: 1.4 + Math.random() * 0.6,
            ease: 'power2.out', onComplete: () => t.remove()
          }
        );
      }
    }

    /* ── RAIN DROPS (instead of confetti) ── */
    function spawnDrops() {
      for (let i = 0; i < 50; i++) {
        const d = document.createElement('div');
        d.style.cssText = `
        position:fixed; pointer-events:none; z-index:999;
        width:3px; height:${14 + Math.random() * 10}px;
        background:linear-gradient(to bottom,transparent,#93c5fd);
        border-radius:2px; opacity:0;
      `;
        document.body.appendChild(d);
        const sx = Math.random() * window.innerWidth;
        gsap.fromTo(d,
          { x: sx, y: -30, opacity: 0.8 },
          {
            y: window.innerHeight + 30,
            x: sx + (Math.random() - 0.5) * 60,
            opacity: 0,
            duration: 1.2 + Math.random() * 1.5,
            delay: Math.random() * 1,
            ease: 'power1.in',
            onComplete: () => d.remove()
          }
        );
      }
    }

    /* ── SECRET LOG: 5 taps on heading ── */
    let tapCount = 0, tapTimer = null;
    document.querySelector('h1').addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
      if (tapCount >= 5) {
        tapCount = 0;
        const panel = document.getElementById('log-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : (renderLog(), 'block');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key === 'L') {
        const panel = document.getElementById('log-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : (renderLog(), 'block');
      }
      if (e.ctrlKey && e.shiftKey && e.key === 'E') {
        const blob = new Blob([JSON.stringify(getLog(), null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'galti_log.json';
        a.click();
      }
    });

    function renderLog() {
      const entries = getLog();
      const container = document.getElementById('log-entries');
      const yesTot = parseInt(localStorage.getItem('__galti_yes__') || '0');
      const noTot = parseInt(localStorage.getItem('__galti_no__') || '0');
      const summary = `
      <div style="background:#1a0a2a;padding:10px;border-radius:8px;margin-bottom:10px">
        <div style="font-size:1rem;margin-bottom:6px">
          😔 Haan taps: <b style="color:#a855f7;font-size:1.2rem">${yesTot}</b>
          &nbsp;&nbsp;
          😤 No dodges: <b style="color:#facc15;font-size:1.2rem">${noTot}</b>
        </div>
        <div style="color:#aaa;font-size:0.7rem;word-break:break-all">
          🌐 IP: <b style="color:#00ff88">${userIP}</b>
        </div>
        <div style="color:#555;font-size:0.6rem;margin-top:4px">
          Heading 5× tap to toggle | Ctrl+Shift+E to download
        </div>
      </div>`;
      if (!entries.length) { container.innerHTML = summary + '<p style="color:#aaa">No activity yet.</p>'; return; }
      container.innerHTML = summary + entries.slice().reverse().map((e) => {
        const icon = e.type === 'YES_CLICK' ? '😔' : '😤';
        const detail = e.type === 'YES_CLICK' ? `Haan tap #${e.count}` : `No dodge #${e.count}`;
        const time = new Date(e.time).toLocaleString('en-IN', { hour12: true });
        return `<div style="border-bottom:1px solid #2a1a4a;padding:5px 0">
        ${icon} <b>${detail}</b><br>
        <span style="color:#aaa;font-size:0.65rem">🌐 ${e.ip} &nbsp;🕐 ${time}</span>
      </div>`;
      }).join('');
      container.scrollTop = 0;
    }

    /* ── ENTRANCE ANIMATIONS ── */
    gsap.from('.heartbreak', { scale: 0, opacity: 0, duration: 0.8, ease: 'back.out(2)', delay: 0.1 });
    gsap.from('h1', { y: -40, opacity: 0, duration: 0.7, ease: 'power3.out', delay: 0.2 });
  </script>
</body>

</html>
